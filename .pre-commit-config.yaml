repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.3.0
      hooks:
          - id: trailing-whitespace
            files: \.(go|yml|yaml)$
          - id: end-of-file-fixer
            files: \.(go|yml|yaml)$
          - id: check-yaml
            files: \.(yml|yaml)$

    - repo: local
      hooks:
          - id: golangci-lint
            name: GolangCI-Lint
            entry: golangci-lint
            args: ["run", "--config", ".golangci.yml", "./app/..."]
            language: system
            types: [go]
            pass_filenames: false

          - id: go-fmt
            name: Go fmt
            entry: go
            args: ["fmt", "./app/..."]
            language: system
            types: [go]

          - id: go-vet
            name: Go vet
            entry: go
            args: ["vet", "./app/..."]
            language: system
            types: [go]

          - id: go-sec
            name: Go sec
            entry: gosec
            args: ["./app/..."]
            language: system
            types: [go]

          - id: go-test
            name: Go test
            entry: go
            args: ["test", "./app/..."]
            language: system
            types: [go]
            pass_filenames: false

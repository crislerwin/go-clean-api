version: 2
run:
  timeout: 5m
  tests: true
  skip-dirs:
    - ^docs$

  # Target Go version for linters (make sure this is <= the golangci-lint binary's supported Go)
  go: "1.25"

linters:
  disable-all: true
  enable:
    - govet
    - gosec
    - gocyclo
    - ineffassign
    - staticcheck
    - godot
    - errcheck

  settings:
    gocyclo:
      min-complexity: 10

    godot:
      exclude:
        - "(?i)^\\s*@"
        - "^\\s*//\\s*@"
        - "^\\s*\\*\\s*@"
        - "SwaggerInfo holds exported Swagger Info so clients can modify it"
    errcheck:
      # Do not force-check some common function names that are safe to ignore.
      exclude-functions:
        - (*os.File).Close
        - (*net.IPConn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - (*net.UnixConn).Close
        - (*net.Pipe).Close
        - (*net.Listener).Close
        - (io.Closer).Close
        - (io.Writer).Write
        - (fmt.Fprintf)
        - (*database/sql.DB).Close
        - (*github.com/jmoiron/sqlx.DB).Close
      check-type-assertions: false

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

issues:
  exclude-dirs:
    - mocks
    - vendor
    - docs
  exclude-files:
    - "_test\\.go$"
    - "docs/docs\\.go"
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude:
    - "error return value not checked.*(Close|Write|Fprintf)"
    - "undefined.*(On|Called|AssertExpectations)"
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - revive
    - path: "vendor/.*"
      linters:
        - "*"
    - linters:
        - errcheck
      text: "Close"
    - path: (.+)_test\.go
      linters:
        - typecheck
    - path: docs/
      linters:
        - "*"

cache:
  enabled: true

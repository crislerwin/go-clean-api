run:
  timeout: 5m
  tests: true
  # Target Go version for linters (make sure this is <= the golangci-lint binary's supported Go)
  go: "1.23"
  issues:
    exclude-dirs:
      - mocks
      - vendor

linters:
  disable-all: true
  enable:
    - gofmt
    - govet
    - gosec
    - gocyclo
    - ineffassign
    - staticcheck
    - godot
    - errcheck

linters-settings:
  gocyclo:
    min-complexity: 10

  gofmt:
    simplify: true

  errcheck:
    # Do not force-check some common function names that are safe to ignore.
    exclude-functions:
      - (*os.File).Close
      - (*net.IPConn).Close
      - (*net.TCPConn).Close
      - (*net.UDPConn).Close
      - (*net.UnixConn).Close
      - (*net.Pipe).Close
      - (*net.Listener).Close
      - (io.Closer).Close
      - (io.Writer).Write
      - (fmt.Fprintf)
    check-type-assertions: false

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude:
    - "error return value not checked.*(Close|Write|Fprintf)"
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - revive
    - path: "vendor/.*"
      linters:
        - "*"
    - linters:
        - errcheck
      text: "Close"
    - path: "_test\\.go"
      linters:
        - typecheck

preset: recommended

cache:
  enabled: true

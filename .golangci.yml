run:
    timeout: 5m
    tests: true
    # Target Go version for linters (make sure this is <= the golangci-lint binary's supported Go)
    go: "1.25"
    issues:
        exclude-dirs:
            - mocks
            - vendor

linters:
    disable-all: true
    enable:
        - gofmt
        - govet
        - gosec
        - gocyclo
        - ineffassign
        - staticcheck
        - godot
        - errcheck
        - shadow

linters-settings:
    gocyclo:
        min-complexity: 10

    gofmt:
        simplify: true

    errcheck:
        # Do not force-check some common function names that are safe to ignore.
        exclude:
            - Close
            - Write
            - Fprintf
        check-type-assertions: false

issues:
    exclude-use-default: false
    max-issues-per-linter: 0
    max-same-issues: 0
    exclude:
        - "error return value not checked.*(Close|Write|Fprintf)"
    exclude-rules:
        - path: "_test\\.go"
          linters:
              - revive
        - path: "vendor/.*"
          linters:
              - "*"
        - linters:
              - errcheck
          text: "Close"

preset: recommended

cache:
    enabled: true

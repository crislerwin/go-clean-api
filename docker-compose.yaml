services:
  # Serviço da API
  app:
    build: .
    container_name: go-clean-api-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    networks:
      - go-clean-api-network

  # Serviço do Banco de Dados
  db:
    image: postgres:15-alpine
    container_name: go-clean-api-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # Exposto para você acessar via DBeaver/PgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - go-clean-api-network

volumes:
  postgres_data:

networks:
  go-clean-api-network:
    driver: bridge
